<script>
  // Dynamic Bio Character Counter Micro-interaction
  const bioInput = document.getElementById('bio');
  const charCount = document.getElementById('char-count');
  if (bioInput && charCount) {
    bioInput.addEventListener('input', () => {
      const len = bioInput.value.length;
      charCount.textContent = `${len} / 160`;
    });
  }

  // Interactive Skill Addition & Removal
  const selectedContainer = document.getElementById('selected-skills-container');
  const suggestedContainer = document.getElementById('suggested-skills-container');

  if (selectedContainer) {
    selectedContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const skillName = btn.querySelector('span:first-child')?.textContent;
      if (!skillName) return;

      btn.remove();

      // Return to suggested if not present
      if (suggestedContainer) {
        const newSuggested = document.createElement('button');
        newSuggested.type = 'button';
        newSuggested.className = 'h-8 px-space-sm rounded-lg bg-surface-container-low text-secondary font-label-md text-label-md flex items-center gap-1 shadow-[-2px_-2px_6px_rgba(255,255,255,0.9),3px_3px_6px_rgba(166,178,196,0.2)] hover:text-on-surface active:shadow-[inset_1px_1px_3px_rgba(166,178,196,0.35)] transition-all';
        newSuggested.innerHTML = `<span class="material-symbols-outlined text-[14px]">add</span><span>${skillName}</span>`;
        suggestedContainer.appendChild(newSuggested);
      }
    });
  }

  if (suggestedContainer) {
    suggestedContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      const skillName = btn.querySelector('span:last-child')?.textContent;
      if (!skillName) return;

      btn.remove();

      // Append to selected
      if (selectedContainer) {
        const newSelected = document.createElement('button');
        newSelected.type = 'button';
        newSelected.className = 'h-8 px-space-sm rounded-lg bg-surface-container-lowest text-on-surface font-label-md text-label-md flex items-center gap-1.5 shadow-[-3px_-3px_8px_rgba(255,255,255,0.9),4px_5px_10px_rgba(166,178,196,0.25)] active:shadow-[inset_2px_2px_4px_rgba(166,178,196,0.3)] transition-all';
        newSelected.innerHTML = `<span>${skillName}</span><span class="material-symbols-outlined text-[14px] text-secondary hover:text-on-surface">close</span>`;
        selectedContainer.appendChild(newSelected);
      }
    });
  }
