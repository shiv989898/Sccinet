<script>
  (function() {
    const bioInput = document.getElementById('bio');
    const bioCounter = document.getElementById('bio-counter');
    if (bioInput && bioCounter) {
      bioInput.addEventListener('input', function() {
        bioCounter.textContent = this.value.length + '/160';
      });
    }

    const selectedContainer = document.getElementById('selected-skills');
    const suggestedContainer = document.getElementById('suggested-skills');

    if (selectedContainer) {
      selectedContainer.addEventListener('click', function(e) {
        const dismissBtn = e.target.closest('.dismiss-btn');
        if (dismissBtn) {
          const chip = dismissBtn.closest('div');
          if (chip) chip.remove();
        }
      });
    }

    if (suggestedContainer && selectedContainer) {
      suggestedContainer.addEventListener('click', function(e) {
        const btn = e.target.closest('.suggested-chip');
        if (btn) {
          const skillName = btn.querySelector('span:last-child').textContent.trim();
          
          const newChip = document.createElement('div');
          newChip.className = "flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-surface-container-high shadow-[2px_4px_12px_rgba(0,0,0,0.4),inset_1px_1px_2px_rgba(255,255,255,0.08),inset_-1px_-1px_2px_rgba(0,0,0,0.3)]";
          newChip.innerHTML = `
            <span class="w-1.5 h-1.5 rounded-full bg-primary inline-block"></span>
            <span class="font-label-md text-label-md text-on-surface">${skillName}</span>
            <button type="button" class="dismiss-btn text-outline hover:text-on-surface flex items-center ml-0.5" aria-label="Remove ${skillName}">
              <span class="material-symbols-outlined text-[16px]">close</span>
            </button>
          `;
          selectedContainer.appendChild(newChip);
          btn.remove();
        }
      });
    }
  })();
