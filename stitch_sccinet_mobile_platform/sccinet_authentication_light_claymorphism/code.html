<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">

<label class="font-label-md text-label-md text-on-surface font-medium" for="password">
            Password

<input autocomplete="current-password" class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-secondary focus:outline-none tracking-widest text-[16px]" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>

</div>

<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>

</div>
<div class="flex flex-col items-center gap-4 text-center mt-1">
<p class="font-body-sm text-body-sm text-secondary">
      Don't have an account? 
      <a class="text-primary font-medium hover:underline" href="#" id="link-signup">
        Sign up
      </a>
</p>
<div class="flex items-center justify-center gap-4 text-secondary font-label-sm text-label-sm">
<a class="hover:text-on-surface transition-colors" href="#">Privacy</a>
<span class="w-1 h-1 rounded-full bg-outline-variant"></span>
<a class="hover:text-on-surface transition-colors" href="#">Terms of Service</a>
</div>
</div>
</div>
<script>
  (function() {
    const pwdInput = document.getElementById('password');
    const toggleBtn = document.getElementById('toggle-password');
    const toggleIcon = document.getElementById('toggle-icon');

    if (toggleBtn && pwdInput && toggleIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdInput.getAttribute('type') === 'password';
        pwdInput.setAttribute('type', isPassword ? 'text' : 'password');
        toggleIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        pwdInput.classList.toggle('tracking-widest', !isPassword);
      });
    }

    const tabSignIn = document.getElementById('tab-signin');
    const tabSignUp = document.getElementById('tab-signup');
    const linkSignUp = document.getElementById('link-signup');

    function setActiveTab(isSignIn) {
      if (isSignIn) {
        tabSignIn.className = 'flex-1 py-2 text-center rounded-lg font-label-lg text-label-lg text-primary transition-all duration-150 bg-surface-container-lowest';
        tabSignIn.style.boxShadow = '-2px -2px 6px rgba(255, 255, 255, 0.9), 2px 3px 8px rgba(166, 178, 196, 0.25)';
        
        tabSignUp.className = 'flex-1 py-2 text-center rounded-lg font-label-lg text-label-lg text-secondary transition-all duration-150';
        tabSignUp.style.boxShadow = 'none';
      } else {
        tabSignUp.className = 'flex-1 py-2 text-center rounded-lg font-label-lg text-label-lg text-primary transition-all duration-150 bg-surface-container-lowest';
        tabSignUp.style.boxShadow = '-2px -2px 6px rgba(255, 255, 255, 0.9), 2px 3px 8px rgba(166, 178, 196, 0.25)';
        
        tabSignIn.className = 'flex-1 py-2 text-center rounded-lg font-label-lg text-label-lg text-secondary transition-all duration-150';
        tabSignIn.style.boxShadow = 'none';
      }
    }

    if (tabSignIn && tabSignUp) {
      tabSignIn.addEventListener('click', function() { setActiveTab(true); });
      tabSignUp.addEventListener('click', function() { setActiveTab(false); });
    }
    if (linkSignUp) {
      linkSignUp.addEventListener('click', function(e) {
        e.preventDefault();
        setActiveTab(false);
      });
    }
  })();
</script></main></body></html>
