  </head><body class="bg-surface font-body-md text-body-md text-on-surface antialiased pt-safe pb-safe min-h-screen"><main class="flex flex-col relative w-full min-h-screen bg-surface px-margin"><div class="flex flex-col w-full pb-8">

</div>
<form class="flex flex-col gap-4" onsubmit="event.preventDefault();">

</div>
</div>
<div class="flex items-center gap-2 pt-1">

<span class="material-symbols-outlined text-[14px]">check</span>

<button class="w-full h-12 mt-2 bg-primary-container text-on-primary font-label-lg text-label-lg rounded-xl flex items-center justify-center gap-2 shadow-[0px_6px_16px_rgba(59,130,246,0.25),2px_4px_12px_rgba(0,0,0,0.4),inset_1px_1px_2px_rgba(255,255,255,0.35),inset_-2px_-2px_4px_rgba(0,0,0,0.3)] active:translate-y-0.5 active:shadow-[inset_2px_2px_4px_rgba(0,0,0,0.5)] transition-all" id="submitBtn" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</form>
<div class="relative flex items-center justify-center my-1">
<div class="w-full h-px bg-surface-container-highest"></div>
<span class="absolute px-3 bg-surface-container font-label-sm text-label-sm text-secondary uppercase tracking-wider">or authenticate with</span>
</div>
<div class="grid grid-cols-2 gap-3">
<button class="h-11 bg-surface-container-high rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md text-on-surface shadow-[2px_4px_12px_rgba(0,0,0,0.3),inset_1px_1px_1px_rgba(255,255,255,0.06),inset_-1px_-1px_2px_rgba(0,0,0,0.3)] active:translate-y-0.5 active:shadow-[inset_2px_2px_4px_rgba(0,0,0,0.5)] transition-all" type="button">
<svg aria-hidden="true" class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"></path>
</svg>
<span>Google</span>
</button>
<button class="h-11 bg-surface-container-high rounded-xl flex items-center justify-center gap-2 font-label-md text-label-md text-on-surface shadow-[2px_4px_12px_rgba(0,0,0,0.3),inset_1px_1px_1px_rgba(255,255,255,0.06),inset_-1px_-1px_2px_rgba(0,0,0,0.3)] active:translate-y-0.5 active:shadow-[inset_2px_2px_4px_rgba(0,0,0,0.5)] transition-all" type="button">
<svg aria-hidden="true" class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>

<span>GitHub</span>
</button>
</div>
</div>
<div class="flex flex-col items-center justify-center gap-4 mt-6 text-center">

<span id="footerToggleText">Don't have an account?</span>
<button class="font-label-md text-label-md text-primary ml-1 hover:underline" id="footerToggleBtn" onclick="toggleModeFromFooter()" type="button">
        Sign up
      </button>
</p>
<div class="flex items-center gap-4 text-secondary font-label-sm text-label-sm">
<a class="hover:text-on-surface transition-colors" href="#terms">Terms of Service</a>

<a class="hover:text-on-surface transition-colors" href="#privacy">Privacy Policy</a>

<a class="hover:text-on-surface transition-colors" href="#security">Security</a>
</div>
</div>
</div>
<script>
  let currentMode = 'signin';

  function switchAuthMode(mode) {
    currentMode = mode;
    const pill = document.getElementById('authPillSelector');
    const tabIn = document.getElementById('tabSignIn');
    const tabUp = document.getElementById('tabSignUp');
    const submitBtn = document.getElementById('submitBtn');
    const forgotLink = document.getElementById('forgotLink');
    const footerText = document.getElementById('footerToggleText');
    const footerBtn = document.getElementById('footerToggleBtn');

    if (mode === 'signup') {
      pill.style.transform = 'translateX(100%)';
      tabIn.className = 'relative z-10 w-1/2 h-full text-center font-label-md text-label-md text-secondary transition-colors';
      tabUp.className = 'relative z-10 w-1/2 h-full text-center font-label-md text-label-md text-on-surface transition-colors';
      submitBtn.querySelector('span:first-child').innerText = 'Create account';
      forgotLink.style.display = 'none';
      footerText.innerText = 'Already have an account?';
      footerBtn.innerText = 'Sign in';
    } else {
      pill.style.transform = 'translateX(0)';
      tabIn.className = 'relative z-10 w-1/2 h-full text-center font-label-md text-label-md text-on-surface transition-colors';
      tabUp.className = 'relative z-10 w-1/2 h-full text-center font-label-md text-label-md text-secondary transition-colors';
      submitBtn.querySelector('span:first-child').innerText = 'Sign in';
      forgotLink.style.display = 'block';
      footerText.innerText = "Don't have an account?";
      footerBtn.innerText = 'Sign up';
    }
  }

  function toggleModeFromFooter() {
    switchAuthMode(currentMode === 'signin' ? 'signup' : 'signin');
  }

  function togglePasswordVisibility() {
    const input = document.getElementById('password');
    const icon = document.getElementById('pwdEyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerText = 'visibility_off';
    } else {
      input.type = 'password';
      icon.innerText = 'visibility';
    }
  }

  function toggleCheckbox(btn) {
    const isChecked = btn.getAttribute('aria-checked') === 'true';
    if (isChecked) {
      btn.setAttribute('aria-checked', 'false');
      btn.className = 'w-5 h-5 rounded-md bg-surface-container-lowest flex items-center justify-center shadow-[inset_2px_2px_4px_rgba(0,0,0,0.6)] cursor-pointer transition-transform active:scale-95';
      btn.innerHTML = '';
    } else {
      btn.setAttribute('aria-checked', 'true');
      btn.className = 'w-5 h-5 rounded-md bg-primary-container flex items-center justify-center shadow-[inset_1px_1px_2px_rgba(255,255,255,0.35),inset_-2px_-2px_4px_rgba(0,0,0,0.3)] text-on-primary cursor-pointer transition-transform active:scale-95';
      btn.innerHTML = '<span class="material-symbols-outlined text-[14px]">check</span>';
    }
  }
</script></main></body></html>
